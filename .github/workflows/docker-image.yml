name: Build and Push Landing Page

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Tag strategy: branch + short SHA
      - name: Set image tag
        run: echo "TAG=main-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push landing image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # amd64 only — the Hetzner deploy target is x86_64, so building
          # arm64 was pure QEMU-emulation overhead with no server to use it,
          # and prone to hanging on npm ci under emulation (see git history).
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/musios-landing:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/musios-landing:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # No checkout/scp step here on purpose — the compose files this reads
      # (docker-compose.yaml + docker-compose.prod.yaml, which define the
      # `landing` service) are owned and kept in sync by the musios repo's
      # own deploy pipeline, not this one. This job only ever touches the
      # one `landing` service, never anything else already on the server.
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # ghcr.io intermittently times out on the TLS handshake (a known,
            # recurring flakiness — not specific to this pipeline). Retry the
            # two network-dependent steps rather than failing the whole
            # deploy on one bad handshake; `up -d`/`prune` are local-only
            # once the image is pulled, so they don't need it.
            retry() {
              local max=3 delay=10 n=1
              until "$@"; do
                if [ "$n" -ge "$max" ]; then
                  echo "Command failed after $max attempts: $*" >&2
                  return 1
                fi
                echo "Attempt $n/$max failed — retrying in ${delay}s..." >&2
                sleep "$delay"
                n=$((n+1))
              done
            }

            login() {
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            }

            retry login
            cd /opt/musios
            retry docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull landing
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d landing
            docker image prune -f
